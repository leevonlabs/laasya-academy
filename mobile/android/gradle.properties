# Force all Gradle caches and downloads to D: drive (protecting C: drive)
gradle.user.home=D:/Android/.gradle
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m
android.useAndroidX=true
android.enableJetifier=true
# Fix Windows cross-drive Kotlin build issue (C: Pub Cache vs D: Project)
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
