<!DOCTYPE html>
<html>
<head>
  <base href="/portal/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Official Mobile Portal for Trainers and Students of Laasya Cultural Academy (లాస్య సాంస్కృతిక అకాడమి).">
  <meta name="theme-color" content="#8A064D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Laasya Academy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Laasya Cultural Academy Mobile</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #590231; margin: 0; padding: 0; overflow: hidden;">
  <div id="laasya-loading" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #590231; z-index: 99999; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #FFFFFF;">
    <div style="position: relative; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center;">
      <div style="position: absolute; inset: 0; border: 3px solid rgba(251, 191, 36, 0.2); border-top-color: #FBBF24; border-radius: 50%; animation: laasya-spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;"></div>
      <div style="font-size: 22px; font-weight: 800; color: #FBBF24; letter-spacing: -0.5px;">L</div>
    </div>
    <div style="margin-top: 20px; font-size: 16px; font-weight: 700; color: #FDF2F8; letter-spacing: 0.3px;">Laasya Cultural Academy</div>
    <div style="margin-top: 6px; font-size: 13px; color: rgba(253, 242, 248, 0.7); font-weight: 500;">Loading Academy Workspace...</div>
  </div>
  <style>
    @keyframes laasya-spin { to { transform: rotate(360deg); } }
  </style>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
